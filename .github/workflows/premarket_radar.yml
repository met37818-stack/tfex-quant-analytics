name: Pre-Market Quant Radar

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run ignoring duplicate guard'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-radar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pre-Market Quant Radar
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            python pre_market_radar.py --force
          else
            python pre_market_radar.py
          fi

      - name: Check if public directory exists
        id: check_public
        run: |
          if [ -d "public" ] && [ -f "public/index.html" ]; then
            echo "has_pages=true" >> $GITHUB_OUTPUT
          else
            echo "has_pages=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Pages Artifact
        if: steps.check_public.outputs.has_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        if: steps.check_public.outputs.has_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
