name: Pre-Market Quant Radar

on:
  schedule:
    # 06:45 ICT (UTC+7) Mon-Fri -> 23:45 UTC Sun-Thu
    - cron: '45 23 * * 0-4'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run ignoring duplicate guard'
        required: false
        type: boolean
        default: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pre-Market Quant Radar
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            python pre_market_radar.py --force
          else
            python pre_market_radar.py
          fi
