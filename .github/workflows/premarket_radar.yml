name: Pre-Market Quant Radar

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run ignoring duplicate guard'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-radar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pre-Market Quant Radar
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            python pre_market_radar.py --force
          else
            python pre_market_radar.py
          fi

      - name: Check if public directory exists
        id: check_public
        run: |
          if [ -d "public" ] && [ -f "public/index.html" ]; then
            echo "has_pages=true" >> $GITHUB_OUTPUT
          else
            echo "has_pages=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Pages Artifact
        if: steps.check_public.outputs.has_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        if: steps.check_public.outputs.has_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report runner failure to Telegram
        # The job's own code sends its own failure message when it gets that far. This
        # step catches what it cannot: a timeout, a cancelled run, or a crash before
        # the entry point (a failed install, an OOM kill). Uses curl only.
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "[RUNNER] no Telegram credentials; skipping runner-failure notice"
            exit 0
          fi
          TEXT="🚨 ${WORKFLOW_NAME}
          runner ปิดงานแบบไม่ปกติ: ${RUN_STATUS}
          สาเหตุที่เป็นไปได้: timeout / ถูกยกเลิก / process ตายก่อนถึง entry point
          (ถ้าได้รับแจ้งเตือนจากตัวแอปไปแล้ว ข้อความนี้คือ fallback ของ runner)
          ${RUN_URL}"
          echo "[RUNNER] sending runner-failure notice (status=${RUN_STATUS})"
          # -f so an HTTP 4xx counts as a failure; the file is a Telegram error
          # envelope (no token) and only its success/failure is logged.
          if curl -fsS --max-time 15 -o /tmp/tg_runner_failure.json \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
               --data-urlencode "text=${TEXT}"; then
            echo "[RUNNER] runner-failure notice delivered"
          else
            echo "[RUNNER] runner-failure notice not delivered (non-fatal)"
          fi
